name: Wdrożenie strony

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Przygotuj pliki strony
        run: |
          mkdir -p dist/gra
          cp index.html gra.html swiat.js z4xmg666.jpg dist/
          cp gra/czcionka.js gra/dzwiek.js gra/grafika.js gra/poziomy.js gra/gra.js dist/gra/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: wdrozenie
        uses: actions/deploy-pages@v4
